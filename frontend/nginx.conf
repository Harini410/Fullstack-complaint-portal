server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Dynamic proxy with runtime resolver so Nginx starts even if 'backend' host is not in local DNS
    location /api/ {
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        set $backend_target "http://backend:8080/api/";
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

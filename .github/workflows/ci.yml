name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Build, Test, Verify, Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Clean Verify (Tests & Spring Boot Package)
        working-directory: ./backend
        run: mvn clean verify -B

      - name: Build Backend Docker Image
        run: docker build -t complaint-backend:latest ./backend

  frontend-ci:
    name: Frontend CI (Build, Lint, Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Frontend Docker Image
        run: docker build -t complaint-frontend:latest ./frontend

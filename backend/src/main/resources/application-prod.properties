# Production Profile (PostgreSQL + External Infrastructure)
# Automatically supports Railway, Render, Docker Compose, and AWS
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:complaintdb}}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKAHOST:${KAFKA_HOST:localhost}}:${KAFKAPORT:${KAFKA_PORT:9092}}}
spring.kafka.consumer.group-id=complaint-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:${REDISPASSWORD:}}
